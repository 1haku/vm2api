EOFNOTES
          gh release edit v1.3.220 --repo dofastted/vm2api --title "vm2api 1.3.220" --notes-file /tmp/notes-220.md
          gh release view v1.3.220 --repo dofastted/vm2api --json name,tagName,targetCommitish,isDraft | tee /tmp/rel.json
          echo "done"
